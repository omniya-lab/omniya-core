name: pr-build

# Give the person who reported the bug something they can actually install.
#
# They are the only one with a braille display, so "is the bug gone" is a
# question only they can answer, and they cannot answer it from a diff. This
# publishes each pull request as its own prerelease and posts one comment with a
# direct download link per platform.
#
# GitHub Actions artifacts were considered and rejected: reaching one means a run
# page, then an artifacts section, then a zip inside a zip. That is a bad path
# with a screen reader. A release page with plainly named assets is the same
# path these testers already use for `testing-app`.
#
# A pull request on a `claude/fix-` branch is built like any other. The
# pipeline opens it with its GitHub App's token, so GitHub starts this run, and
# `pipeline-verify.yml` waits for it. Only the `comment` job skips it: the
# download links are posted to the ISSUE, by the verify report, because the
# contributor never reads the pull request.
#
# Two kinds of job, and the split is the point. A BUILD job runs the repository's own
# scripts (`npm ci`, `npm run dist:*`) with a read-only token and no secret, and hands its
# files on as an artifact. The PUBLISH job holds the write token, runs nothing from the
# repository (no checkout, no npm) and only calls `gh`. So a build script, which anyone
# may change by saying "it works", never runs where there is a token to take.
# `test/unit/pipeline/zones.test.js` holds that rule.
on:
  pull_request:
    branches: [testing]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pack-mac:
    runs-on: ${{ vars.MAC_RUNNER || 'macos-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: brew install liblouis
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: build-mac
          path: dist/*.zip
          if-no-files-found: error

  pack-win:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      # Top-level dist/*.exe only. dist/win-unpacked holds the NSIS target's intermediate
      # build (bundled liblouis and elevate helpers, the raw unpacked exe), which must never
      # be uploaded as if it were a release asset. testing-app.yml documents the same trap.
      - uses: actions/upload-artifact@v4
        with:
          name: build-win
          path: dist/*.exe
          if-no-files-found: error

  # Holds the write token and runs nothing from the repository: no checkout, no npm, only gh.
  publish:
    needs: [pack-mac, pack-win]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true
      - name: Publish both builds to this pull request's prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Through env, never inline in the command: a branch name is
          # attacker-controlled text and `run:` is a shell.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          TAG="pr-${PR_NUMBER}"
          NOTES="Test build of pull request #${PR_NUMBER}, at commit ${HEAD_SHA}.

          This is not a release. It exists so the person who reported the bug can
          check the fix on their own hardware before it reaches anyone else.

          - **Apple Silicon Mac** - \`Omniya-Core-mac-arm64.zip\`. Unzip and run.
          - **Windows x64** - \`Omniya-Core-Setup-x64.exe\`, an installer.

          Both are unsigned, and neither auto-updates. When the pull request is
          updated, these assets are replaced in place, so download again."
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --prerelease --title "Test build for PR #${PR_NUMBER}" --notes "$NOTES" --target "$HEAD_SHA"
          gh release edit "$TAG" --notes "$NOTES"
          gh release upload "$TAG" builds/*.zip builds/*.exe --clobber

  comment:
    needs: [publish]
    if: ${{ !startsWith(github.head_ref, 'claude/fix-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Post one comment with a direct link per platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="pr-${PR_NUMBER}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          BODY="### Test build ready

          Install this and tell us whether the bug is gone. Direct links, no run
          pages to navigate:

          - Apple Silicon Mac: ${BASE}/Omniya-Core-mac-arm64.zip
          - Windows x64: ${BASE}/Omniya-Core-Setup-x64.exe

          On the Mac, unzip it and run it. On Windows, run the installer. Both
          are unsigned, so your machine will ask you to confirm. Neither
          auto-updates, and neither replaces the alpha build you already have.

          If this pull request changes again, these links stay the same and the
          files behind them are replaced. Download again rather than looking for
          a new link."

          # One comment, edited in place rather than a new one per push. A thread
          # that grows a near-identical comment on every commit is noise to
          # scroll past, and worse to hear read aloud. `--edit-last` updates the
          # comment this workflow already left; `--create-if-none` writes the
          # first one.
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY" --edit-last --create-if-none
