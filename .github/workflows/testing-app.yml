name: testing-app

# The rolling alpha of `testing`. Two kinds of job, and the split is the point.
# A BUILD job runs the repository's own scripts (`npm ci`, `npm run dist:*`) with a
# read-only token and no secret, and hands its files on as an artifact. The PUBLISH job
# holds the write token, runs nothing from the repository (no checkout, no npm) and only
# calls `gh`. A build script therefore never runs where there is a token to take.
# `test/unit/pipeline/zones.test.js` holds that rule.
on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-mac:
    runs-on: ${{ vars.MAC_RUNNER || 'macos-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: brew install liblouis
      - run: npm ci
      - run: npm run version:bump
      - run: npm run dist:mac
      - name: Write version manifest
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); fs.writeFileSync('dist/version.json', JSON.stringify({version: pkg.version}))"
      - uses: actions/upload-artifact@v4
        with:
          name: build-mac
          path: |
            dist/*.zip
            dist/version.json
          if-no-files-found: error

  pack-win:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run version:bump
      - run: npm run dist:win
      # Top-level dist/* only: dist/win-unpacked holds the NSIS target's intermediate build
      # (bundled liblouis/elevate helpers, the raw unpacked app exe) which must never be
      # uploaded as if it were a release asset. alpha.yml (not the literal "latest.yml", and
      # not a *.yml wildcard - that also matches electron-builder's own builder-debug.yml
      # dump) because bump-testing-version.mjs always tags testing builds with the "alpha"
      # prerelease channel, so electron-builder names the update-info file alpha.yml.
      - uses: actions/upload-artifact@v4
        with:
          name: build-win
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/alpha.yml
          if-no-files-found: error

  # Holds the write token and runs nothing from the repository: no checkout, no npm, only gh.
  publish:
    needs: [pack-mac, pack-win]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true
      - name: Publish the zip, the installer and the update metadata to the testing-app prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The notes are rewritten on EVERY build, not just the first. They used
          # to sit behind `gh release view ... ||`, so the body written when the
          # release was created never changed again -- it still advertised
          # "rolling unsigned zips, re-download after each push" long after the
          # Windows target became an NSIS installer, sending Windows testers to
          # look for a zip asset that does not exist.
          NOTES=$(cat <<'EOF'
          Rolling unsigned builds of the `testing` branch. Download the asset for your platform:

          - **Apple Silicon Mac** — `Omniya-Core-mac-arm64.zip`. Unzip and run. There is no auto-update; the app shows an in-app notice when a newer build exists, and you re-download this zip.
          - **Windows x64** — `Omniya-Core-Setup-x64.exe`, an installer (there is **no** Windows zip). Once installed it auto-updates in the background, so you only download this once.

          `version.json` and `alpha.yml` are update metadata, not downloads. Apple Silicon Mac and Windows x64 only; both are unsigned.
          EOF
          )
          gh release view testing-app >/dev/null 2>&1 \
            || gh release create testing-app --prerelease --title "Testing alpha (unsigned)" --notes "$NOTES" --target "$GITHUB_SHA"
          gh release edit testing-app --notes "$NOTES"
          # Move the tag to this commit through the API, so no checkout is needed. One job
          # moves it now, so the two builds no longer race for it.
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/testing-app" -f sha="$GITHUB_SHA" -F force=true >/dev/null \
            || gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/testing-app -f sha="$GITHUB_SHA" >/dev/null
          gh release upload testing-app builds/*.zip builds/version.json builds/*.exe builds/*.exe.blockmap builds/alpha.yml --clobber
