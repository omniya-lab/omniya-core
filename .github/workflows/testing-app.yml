name: testing-app

on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack-mac:
    runs-on: ${{ vars.MAC_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: brew install liblouis
      - run: npm ci
      - run: npm run version:bump
      - run: npm run dist:mac
      - name: Write version manifest
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); fs.writeFileSync('dist/version.json', JSON.stringify({version: pkg.version}))"
      - name: Publish zip + version manifest to testing-app prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The notes are rewritten on EVERY build, not just the first. They used
          # to sit behind `gh release view ... ||`, so the body written when the
          # release was created never changed again -- it still advertised
          # "rolling unsigned zips, re-download after each push" long after the
          # Windows target became an NSIS installer, sending Windows testers to
          # look for a zip asset that does not exist.
          NOTES=$(cat <<'EOF'
          Rolling unsigned builds of the `testing` branch. Download the asset for your platform:

          - **Apple Silicon Mac** — `Omniya-Core-mac-arm64.zip`. Unzip and run. There is no auto-update; the app shows an in-app notice when a newer build exists, and you re-download this zip.
          - **Windows x64** — `Omniya-Core-Setup-x64.exe`, an installer (there is **no** Windows zip). Once installed it auto-updates in the background, so you only download this once.

          `version.json` and `alpha.yml` are update metadata, not downloads. Apple Silicon Mac and Windows x64 only; both are unsigned.
          EOF
          )
          gh release view testing-app >/dev/null 2>&1 \
            || gh release create testing-app --prerelease --title "Testing alpha (unsigned)" --notes "$NOTES" --target "$GITHUB_SHA"
          gh release edit testing-app --notes "$NOTES"
          git tag -f testing-app "$GITHUB_SHA"
          # `pack-win` moves this same tag to this same commit at the same time. Git
          # refuses whichever push loses ("cannot lock ref"), and that failure used
          # to stop this job BEFORE the upload below, so the Mac zip was never
          # published and the run was red. If the tag is already where it should
          # be, the other job did the work and there is nothing to fail about.
          git push origin testing-app --force \
            || [ "$(git ls-remote origin refs/tags/testing-app | cut -f1)" = "$GITHUB_SHA" ]
          gh release upload testing-app dist/*.zip dist/version.json --clobber

  pack-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run version:bump
      - run: npm run dist:win
      - name: Publish installer + update metadata to testing-app prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view testing-app >$null 2>&1; if ($LASTEXITCODE -ne 0) { gh release create testing-app --prerelease --title "Testing alpha (unsigned)" --notes "Rolling unsigned builds for the testing branch. Windows installs auto-update in the background; macOS testers get an in-app notice to re-download. Apple Silicon Mac and Windows x64 only." --target $env:GITHUB_SHA }
          git tag -f testing-app $env:GITHUB_SHA
          # `pack-mac` moves this same tag to this same commit at the same time. Git
          # refuses whichever push loses ("cannot lock ref"). If the tag is already
          # where it should be, the other job did the work.
          git push origin testing-app --force
          if ($LASTEXITCODE -ne 0) {
            $remote = (git ls-remote origin refs/tags/testing-app) -split "`t" | Select-Object -First 1
            if ($remote -ne $env:GITHUB_SHA) { throw "could not move the testing-app tag" }
            $global:LASTEXITCODE = 0
          }
          # Top-level dist\* only (no -Recurse): dist\win-unpacked holds the NSIS
          # target's intermediate build (bundled liblouis/elevate helpers, the raw
          # unpacked app exe) which must never be uploaded as if it were a release asset.
          # alpha.yml (not the literal "latest.yml", and not a *.yml wildcard - that
          # also matches electron-builder's own builder-debug.yml dump) because
          # bump-testing-version.mjs always tags testing builds with the "alpha"
          # prerelease channel, so electron-builder names the update-info file
          # alpha.yml specifically.
          $assets = Get-ChildItem -Path "dist\*" -Include *.exe,*.exe.blockmap,alpha.yml
          if (-not $assets) { throw "No installer/update assets found in dist" }
          foreach ($asset in @($assets)) {
            gh release upload testing-app $asset.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed for $($asset.FullName)" }
          }
