name: pipeline-agent

# The one place an agent runs. `pipeline-fix.yml`, `pipeline-followup.yml` and
# `pipeline-verify.yml` call it, each with a different `mode`:
#
#   fix            a new bug report. Reproduce, fix, open a DRAFT pull request.
#   comment        the contributor wrote on the issue. Revise, answer, or take
#                  "it works" as sign-off.
#   checks-failed  the automatic checks or the build failed on the fix branch.
#                  Repair the cause, or say the check is what is wrong.
#
# One file, so one prompt and one tool list. They used to exist twice and had to
# be kept equal by hand.
#
# `kind` says what sort of report it is: `bug`, or `nemeth` (a symbol or rule of
# the Nemeth Code that the app lacks). A design idea never reaches this file.
# `scripts/ci/issue-kind.mjs` sends those to a person.
#
# THE AGENT POSTS NOTHING ON THE ISSUE. The contributor used to hear the agent
# and the pipeline say the same thing in two comments. Now the agent leaves its
# words in a file, this job returns them as the `message` output, and
# `scripts/ci/reply.mjs` posts them inside the one comment the event gets. The
# job below has `issues: read` and no more, so that is a fact and not a request.
#
# THE AGENT NEVER STARTS A WORKFLOW AND NEVER MARKS A PULL REQUEST READY. This
# job holds no `actions` permission, and it ends by writing ONE WORD to a file.
# The jobs after it, which read no untrusted text, act on that word. Nothing
# here is decided by what the agent says in a comment.
#
# `track_progress` is off on purpose. With it on, the action chooses its "tag"
# mode, and on an issue that mode cuts a branch of its own, which would break
# the promise that every round lands on the same branch and the same links. With
# it off and `prompt` set, the action chooses "agent" mode, which makes no
# branch. The fix prompt below creates its own branch.
on:
  workflow_call:
    # Declared so callers can pass them by name. The value passed is empty on purpose:
    # the real secrets live only in the environment `pipeline`, which the called job reads.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      PIPELINE_APP_PRIVATE_KEY:
        required: false
    inputs:
      mode:
        description: fix, comment, or checks-failed
        required: true
        type: string
      kind:
        description: bug or nemeth
        required: false
        type: string
        default: bug
      issue_number:
        description: Number of the issue (the bug report)
        required: true
        type: string
      pr_number:
        description: Pull request number. Empty in fix mode
        required: false
        type: string
        default: ''
      branch:
        description: The claude/fix- branch. Empty in fix mode
        required: false
        type: string
        default: ''
      question_round:
        description: How many times the agent has already asked this contributor a question (fix only)
        required: false
        type: string
        default: '0'
      # Set by the follow-up gate, from `author_association` (which GitHub fills
      # in) and the id of the comment that started the run. Never read from the
      # text of a comment. It names ONE comment, not "whatever is newest": a
      # comment added while this run waits in the queue is not covered.
      owner_comment_id:
        description: Id of the comment in which the repository owner said to go ahead. Empty when there is none
        required: false
        type: string
        default: ''
      owner_comment_updated_at:
        description: When that comment was last changed, as the gate saw it. An edit afterwards voids the approval
        required: false
        type: string
        default: ''
      log_artifact:
        description: Name of the artifact holding the failed-check log (checks-failed only)
        required: false
        type: string
        default: ''
    outputs:
      result:
        description: One word. See the allowed words per mode in the prompt
        value: ${{ jobs.agent.outputs.result }}
      branch:
        description: The fix branch
        value: ${{ jobs.agent.outputs.branch }}
      pr:
        description: The pull request number
        value: ${{ jobs.agent.outputs.pr }}
      message:
        description: What the agent wants the contributor to hear. Agent text, never to be put in a run line
        value: ${{ jobs.agent.outputs.message }}

permissions:
  contents: read

jobs:
  agent:
    # The two secrets live in the environment `pipeline`, which allows only
    # `testing`. A run from any other ref cannot read them.
    environment: pipeline
    # Explicit, and without `actions`. The agent in this job runs unrestricted
    # Bash, so it must not be able to start, cancel or re-run other workflows.
    # And `issues: read`, not write: it must not be able to comment on the issue.
    permissions:
      contents: write
      pull-requests: write
      issues: read
    runs-on: ${{ vars.MAC_RUNNER || 'macos-latest' }}
    # macOS because the gates below include the Electron e2e suite, and
    # `scripts/stage-liblouis.mjs` supports darwin and win32 only.
    timeout-minutes: 60
    outputs:
      result: ${{ steps.result.outputs.result }}
      branch: ${{ steps.result.outputs.branch }}
      pr: ${{ steps.result.outputs.pr }}
      message: ${{ steps.result.outputs.message }}
    steps:
      # Everything below is a number or one of a few words. Check that before any
      # of it reaches a checkout, a command line or the prompt.
      - env:
          MODE: ${{ inputs.mode }}
          KIND: ${{ inputs.kind }}
          ISSUE: ${{ inputs.issue_number }}
          PR: ${{ inputs.pr_number }}
          BRANCH: ${{ inputs.branch }}
          QUESTION_ROUND: ${{ inputs.question_round }}
          OWNER_COMMENT_ID: ${{ inputs.owner_comment_id }}
          OWNER_COMMENT_AT: ${{ inputs.owner_comment_updated_at }}
        run: |
          set -euo pipefail
          case "$OWNER_COMMENT_AT" in *[!0-9TZ:-]*) echo "owner_comment_updated_at is not a timestamp" >&2; exit 1 ;; esac
          case "$OWNER_COMMENT_ID" in *[!0-9]*) echo "owner_comment_id must be digits or empty" >&2; exit 1 ;; esac
          case "$MODE" in
            fix|comment|checks-failed) ;;
            *) echo "mode must be fix, comment or checks-failed, got: $MODE" >&2; exit 1 ;;
          esac
          case "$KIND" in
            bug|nemeth) ;;
            *) echo "kind must be bug or nemeth, got: $KIND" >&2; exit 1 ;;
          esac
          case "$ISSUE" in ''|*[!0-9]*) echo "issue_number must be digits" >&2; exit 1 ;; esac
          case "$QUESTION_ROUND" in ''|*[!0-9]*) echo "question_round must be digits" >&2; exit 1 ;; esac
          if [ "$MODE" != "fix" ]; then
            case "$PR" in ''|*[!0-9]*) echo "pr_number must be digits" >&2; exit 1 ;; esac
            case "$BRANCH" in
              claude/fix-*) ;;
              *) echo "branch '$BRANCH' is not one this pipeline created. Refusing." >&2; exit 1 ;;
            esac
          fi

      # A token for the pipeline's GitHub App. A pull request opened, or a branch
      # pushed, with the built-in token starts no `pull_request` checks. With
      # an App token it does. The App has no Workflows permission, so it cannot
      # push `.github/workflows/**`.
      - id: app
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          # A new fix starts from `testing`. A comment or a repair continues on
          # the branch the pull request is already on, because `pr-build.yml`
          # publishes to a release tagged `pr-<number>` and tells the
          # contributor her links stay the same. That holds only if every round
          # lands on this one branch.
          ref: ${{ inputs.mode == 'fix' && 'testing' || inputs.branch }}
          fetch-depth: 0

      # Where the remote branch stood, so the last step can tell a revision from
      # an answered question.
      - id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: brew install liblouis
      - run: npm ci

      # The helper scripts and the contributor list come out of `origin/testing`,
      # never out of the branch just checked out. That branch
      # is the thing under discussion, and a branch that could rewrite the list
      # or the filter could admit itself.
      - run: |
          set -euo pipefail
          T="$RUNNER_TEMP/trusted"
          mkdir -p "$T/scripts/ci" "$T/.github"
          git fetch --no-tags origin testing
          for f in gh.mjs find-fix-pr.mjs listed-thread.mjs reply.mjs agent-digest.mjs; do
            git show "origin/testing:scripts/ci/$f" > "$T/scripts/ci/$f"
          done
          git show origin/testing:scripts/ci/allowlist.mjs > "$T/scripts/ci/allowlist.mjs"
          git show origin/testing:.github/contributors.yml > "$T/.github/contributors.yml"
          # The agent's instructions, from the same trusted place. The branch can
          # be edited by the agent itself, so it must not supply its own rules.
          mkdir -p "$T/.github/prompts"
          git show origin/testing:.github/prompts/agent.md > "$T/.github/prompts/agent.md"

      # Build the thread the agent reads, from people on the contributor list
      # only. Anyone can comment on a public issue, and the gate vetted exactly
      # one comment. Fix mode reads it too: a report can be answered, and a
      # question the agent asked has to be read next to its answer. In fix mode
      # there is no pull request yet, and the thread says so.
      - id: thread
        if: inputs.mode == 'comment' || inputs.mode == 'fix'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          APPROVAL_ID: ${{ inputs.owner_comment_id }}
          APPROVAL_UPDATED_AT: ${{ inputs.owner_comment_updated_at }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/trusted"
          W="$RUNNER_TEMP/work"
          mkdir -p "$W"
          # The REST API, not `gh pr view`: it names a bot `github-actions[bot]`,
          # which is what `listed-thread.mjs` expects of the pipeline's own author.
          if [ -n "$PR_NUMBER" ]; then
            gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '{number, author: .user.login, body}' > "$W/pr.json"
          else
            echo null > "$W/pr.json"
          fi
          # The approval token. Random, made in this run, and not shown anywhere
          # until the thread file is built, so nobody could have written it in a
          # comment. Made in EVERY run, not only when there is an approval: with no
          # token the prompt would name an empty one, and a forged heading with an
          # empty token would match it. With no approval the real heading never
          # appears, so any heading that claims one is a forgery.
          TOKEN="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          gh api "repos/$REPO/issues/$ISSUE_NUMBER" --jq '{number, author: .user.login, body}' > "$W/issue.json"
          gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" --paginate \
            --jq '[.[] | {id: .id, author: .user.login, body, createdAt: .created_at, updatedAt: .updated_at}]' | jq -s 'add // []' > "$W/comments.json"
          jq -n --slurpfile pr "$W/pr.json" --slurpfile issue "$W/issue.json" --slurpfile comments "$W/comments.json" \
            --arg approvalId "$APPROVAL_ID" --arg approvalToken "$TOKEN" --arg approvalUpdatedAt "$APPROVAL_UPDATED_AT" \
            '{pr: $pr[0], issue: $issue[0], comments: $comments[0], approvalId: $approvalId, approvalToken: $approvalToken, approvalUpdatedAt: $approvalUpdatedAt}' > "$W/thread.json"
          node "$T/scripts/ci/listed-thread.mjs" "$W/thread.json" "$T/.github/contributors.yml" > "$RUNNER_TEMP/thread.md"
          echo "wrote $(wc -c < "$RUNNER_TEMP/thread.md") bytes to the filtered thread"

      - if: inputs.mode == 'checks-failed'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.log_artifact }}
          path: ${{ runner.temp }}/failed-checks

      - id: agent
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # Agent mode names the DEFAULT branch to its own tools unless told.
          CLAUDE_BRANCH: ${{ inputs.branch }}
        with:
          # The maintainer's Max subscription, through a token from
          # `claude setup-token`. There is deliberately no API key input and no
          # ANTHROPIC_API_KEY anywhere in this file: a key present would bill
          # per token instead of drawing on the subscription.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          base_branch: testing
          track_progress: false
          # A manual run that `pipeline-keep-current.yml` starts after a push is started BY
          # the Actions bot, and the action refuses a bot actor unless it is named:
          # "Workflow initiated by non-human actor: github-actions (type: Bot)". Seen live,
          # four repairs in a row. Only for a manual run, and only that one bot. A person
          # who starts a run by hand is not a bot and is unaffected. An issue or a comment
          # still needs a person with write access, as before.
          allowed_bots: ${{ github.event_name == 'workflow_dispatch' && 'github-actions' || '' }}
          # `--allowedTools` is not optional decoration. The action's default
          # tool preset has no Bash, no Edit and no Write, and its own docs say
          # so: "Claude does not have access to execute arbitrary Bash commands
          # by default." Measured on run 33835963064: with the preset alone,
          # every step of the prompt below was impossible. Do not trim this list
          # without re-reading that run.
          #
          # Bash is unrestricted rather than a list of `Bash(npm test:*)`
          # patterns, because the gates shell out further -- `npm` to `node`, to
          # `electron`, to `brew`-installed `liblouis` -- and a pattern list that
          # covers that is a list nobody can keep correct. What contains this is
          # the allowlist gate in the calling workflow: only a named contributor
          # can start a run at all.
          claude_args: |
            --max-turns 60
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,NotebookEdit,TodoWrite,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
          prompt: |
            Header values for your instructions:
              MODE=${{ inputs.mode }}
              KIND=${{ inputs.kind }}
              ISSUE_NUMBER=${{ inputs.issue_number }}
              PR_NUMBER=${{ inputs.pr_number }}
              BRANCH=${{ inputs.branch }}
              QUESTION_ROUND=${{ inputs.question_round }}
              APPROVAL_TOKEN=${{ steps.thread.outputs.token }}
              TEMP_DIR=${{ runner.temp }}

            Read `${{ runner.temp }}/trusted/.github/prompts/agent.md` now and
            follow it exactly. It is your full instructions. Read only that copy.
            Do not use any other file of that name.

      # Show what the agent did, so a silent stop can be diagnosed. The action
      # hides its own output because tool results can hold secrets. This keeps only
      # the agent's words and the names of its tools, scrubbed, and drops the
      # rest. It runs even when the agent step failed, and it can never fail the
      # job. See `scripts/ci/agent-digest.mjs` for what is kept and what is not.
      - if: always()
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          # No secret goes into this step. The agent has a shell and can write to
          # the folder this script is copied into, so a secret handed to the
          # script is a secret handed to whatever the agent left there. What
          # is shown is cleaned by pattern instead.
        run: |
          node "$RUNNER_TEMP/trusted/scripts/ci/agent-digest.mjs" \
            "${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}" \
            "$RUNNER_TEMP/result.txt" "$RUNNER_TEMP/message.md"

      # A fix opened a pull request. Find it the strict way, from the trusted
      # copy of the helper, not from the branch the agent could have edited.
      - id: found
        if: inputs.mode == 'fix'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        run: node "$RUNNER_TEMP/trusted/scripts/ci/find-fix-pr.mjs" "$ISSUE"

      # Turn what the agent wrote into outputs the next jobs can trust: one word
      # from a short list, a pull request found by the strict rule, whether the
      # branch actually moved, and the agent's words for the contributor.
      #
      # The words are agent text, and the agent has read untrusted reports. They
      # leave this job as a multi-line output under a delimiter nobody can guess,
      # and every later job takes them through `env`, never inside a `run:` line.
      # `scripts/ci/reply.mjs` cuts them to size before they are posted.
      - id: result
        env:
          MODE: ${{ inputs.mode }}
          BRANCH_IN: ${{ inputs.branch }}
          PR_IN: ${{ inputs.pr_number }}
          BEFORE: ${{ steps.before.outputs.sha }}
          FOUND_COUNT: ${{ steps.found.outputs.count }}
          FOUND_PR: ${{ steps.found.outputs.pr }}
          FOUND_BRANCH: ${{ steps.found.outputs.branch }}
        run: |
          set -euo pipefail
          # A run that cannot say what happened is a FAILURE of the run, not a
          # result. It used to become a made-up word that reached the
          # contributor as "I could not finish this one" with no reason, and the
          # thread went quiet (issue #58). Failing turns the job red, so the
          # maintainer is emailed, and the later `failed` job tells the
          # contributor the truth: something went wrong on the pipeline's side.
          fail() {
            echo "$1" >&2
            {
              echo "### The agent run ended without a usable result"
              echo
              echo "$1"
              echo
              echo "See \"What the agent did\" above for what it did before it ended."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          word=""
          if [ -f "$RUNNER_TEMP/result.txt" ]; then
            word="$(head -n1 "$RUNNER_TEMP/result.txt" | tr -d '[:space:]')"
          fi
          case "$MODE" in
            fix) allowed="opened asked needs-design blocked" ;;
            comment) allowed="revised answered approved needs-design blocked" ;;
            *) allowed="revised needs-owner" ;;
          esac
          ok=no
          for a in $allowed; do [ "$word" = "$a" ] && ok=yes; done
          [ "$ok" = yes ] || fail "The result '$word' is not allowed in mode $MODE. Allowed: $allowed."

          branch="$BRANCH_IN"
          pr="$PR_IN"
          if [ "$MODE" = "fix" ]; then
            if [ "$word" = "opened" ]; then
              if [ "$FOUND_COUNT" = "1" ]; then
                branch="$FOUND_BRANCH"
                pr="$FOUND_PR"
              else
                fail "The agent said it opened a pull request, but $FOUND_COUNT pull requests matched."
              fi
            fi
          elif [ "$word" = "revised" ]; then
            after="$(git ls-remote origin "refs/heads/$BRANCH_IN" | cut -f1)"
            [ "$after" != "$BEFORE" ] || fail "The agent said it revised the branch, but the branch did not move."
          elif [ "$word" = "approved" ] && [ "$(git ls-remote origin "refs/heads/$BRANCH_IN" | cut -f1)" != "$BEFORE" ]; then
            # "It works" applies to the build the contributor tested. A branch that moved during this run must not merge on it.
            word=blocked
            printf '%s\n' "The branch changed while I was reading your answer, so I did not send it on. Please test the newest build and tell me again." > "$RUNNER_TEMP/message.md"
          fi
          # `approved` and the repair mode say nothing to the contributor. Every
          # other word has words, and no words is a failure, because a thread that
          # goes quiet is the one thing this pipeline must not do.
          msg=""
          if [ "$word" != approved ] && [ "$MODE" != checks-failed ]; then
            [ -s "$RUNNER_TEMP/message.md" ] || fail "The agent wrote '$word' but no message.md, so there is nothing to tell the contributor."
            msg="$(head -c 4000 "$RUNNER_TEMP/message.md" | tr -d '\000')"
            [ -n "$(printf '%s' "$msg" | tr -d '[:space:]')" ] || fail "The agent wrote '$word' but message.md is empty."
          fi
          delim="MESSAGE_$(od -An -N12 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "result=$word"
            echo "branch=$branch"
            echo "pr=$pr"
            echo "message<<$delim"
            printf '%s\n' "$msg"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          echo "result: $word"
